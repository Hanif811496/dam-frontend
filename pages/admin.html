<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — DAM</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .admin-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .section-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      background: var(--surface-2);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-info { flex: 1; min-width: 0; }

    .user-nama {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .user-division {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-weight: 600;
      flex-shrink: 0;
    }

    .div-manager      { background:#FCEBEB; color:var(--primary); }
    .div-design       { background:#E6F1FB; color:var(--accent-blue); }
    .div-3d           { background:#EEEDFE; color:#3C3489; }
    .div-animator     { background:#E1F5EE; color:#085041; }
    .div-editor       { background:#FAEEDA; color:#633806; }
    .div-render       { background:#F1EFE8; color:#444441; }
    .div-custom       { background:#F5F5F5; color:#666; }
    .div-none         { background:#F5F5F5; color:#aaa; }

    .user-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-icon {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-dark);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .btn-icon:hover { border-color: var(--primary); color: var(--primary); }
    .btn-icon.danger:hover { border-color: var(--danger); color: var(--danger); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-md);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    .staff-toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1.4fr) minmax(180px, .8fr) minmax(180px, .8fr) auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
    }

    .staff-search-wrap {
      position: relative;
    }

    .staff-search-wrap i {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .staff-search-wrap .input {
      padding-left: 35px;
    }

    .staff-result-count {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      text-align: right;
    }

    .staff-pagination {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .staff-pagination-info {
      font-size: 11px;
      color: var(--text-muted);
    }

    .staff-pagination-buttons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .staff-page-btn {
      min-width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 7px;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      padding: 0 8px;
    }

    .staff-page-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .staff-page-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .staff-page-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .user-list-empty {
      border: 1px dashed var(--border-dark);
      border-radius: var(--radius-md);
      padding: 30px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      background: var(--surface);
    }

    @media (max-width: 1050px) {
      .staff-toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .staff-result-count {
        text-align: left;
      }
    }

    @media (max-width: 700px) {
      .admin-wrap {
        grid-template-columns: 1fr;
      }

      .staff-toolbar {
        grid-template-columns: 1fr;
      }

      .user-item {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .user-division {
        order: 3;
      }

      .user-actions {
        margin-left: auto;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <button class="sidebar-toggle-btn" id="sidebar-toggle" title="Tampilkan/sembunyikan sidebar">
      <i data-lucide="panel-left"></i>
    </button>
    <div class="navbar-brand">DAM System</div>
    <div style="margin-left:8px;font-size:11px;background:var(--primary);color:white;padding:2px 8px;border-radius:var(--radius-full);font-weight:600;">ADMIN</div>
    <div class="navbar-right">
      <span id="user-name" style="font-size:14px;color:var(--text-muted);"></span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Keluar</button>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label">Menu</div>
    <a href="gallery.html" class="sidebar-item">
      <i data-lucide="image"></i> Gallery
    </a>
    <a href="upload.html" class="sidebar-item">
      <i data-lucide="upload-cloud"></i> Upload
    </a>
    <a href="folders.html" class="sidebar-item">
      <i data-lucide="folder"></i> Folders
    </a>
    <a href="profile.html" class="sidebar-item">
      <i data-lucide="user"></i> Profile
    </a>

    <div class="sidebar-label">Admin</div>
    <a href="dashboard.html" class="sidebar-item">
      <i data-lucide="layout-dashboard"></i> Dashboard
    </a>
    <a href="admin.html" class="sidebar-item active">
      <i data-lucide="users"></i> Users
    </a>
  </aside>

  <main class="main-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div class="page-title" style="margin:0;">Manajemen User</div>
      <button class="btn btn-primary" onclick="bukaModalBuatAkun()">
        <i data-lucide="user-plus" style="width:15px;height:15px;"></i> Buat Akun Staff
      </button>
    </div>

    <div class="staff-toolbar">
      <div class="staff-search-wrap">
        <i data-lucide="search"></i>
        <input
          type="text"
          class="input"
          id="staff-search"
          placeholder="Cari nama atau email..."
          autocomplete="off"
        >
      </div>

      <select class="input" id="staff-filter-division">
        <option value="">Semua divisi</option>
        <option value="__none__">Belum ada divisi</option>
      </select>

      <select class="input" id="staff-sort">
        <option value="name_asc">Nama A–Z</option>
        <option value="name_desc">Nama Z–A</option>
        <option value="division_asc">Divisi A–Z</option>
        <option value="division_desc">Divisi Z–A</option>
      </select>

      <div class="staff-result-count" id="staff-result-count">Memuat staff...</div>
    </div>

    <div class="admin-wrap">
      <div class="section-box">
        <div class="section-title">
          <i data-lucide="users" style="width:16px;height:16px;color:var(--primary);"></i>
          Daftar Staff
        </div>
        <div id="user-list">
          <div style="display:flex;justify-content:center;padding:30px;">
            <div class="spinner"></div>
          </div>
        </div>

        <div class="staff-pagination" id="staff-pagination">
          <div class="staff-pagination-info" id="staff-pagination-info"></div>
          <div class="staff-pagination-buttons" id="staff-pagination-buttons"></div>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">
          <i data-lucide="layers" style="width:16px;height:16px;color:var(--accent-blue);"></i>
          Ringkasan Divisi
        </div>
        <div id="division-info">
          <div style="display:flex;justify-content:center;padding:20px;"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Buat Akun -->
  <div class="modal-overlay" id="modal-buat">
    <div class="modal-box">
      <div class="modal-title">Buat Akun Staff Baru</div>
      <div class="form-group">
        <label>Nama lengkap</label>
        <input type="text" class="input" id="new-nama" placeholder="Nama staff">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="input" id="new-email" placeholder="email@temotion.id">
      </div>
      <div class="form-group">
        <label>Password sementara</label>
        <input type="text" class="input" id="new-password" placeholder="Min. 6 karakter" value="temotion123">
      </div>
      <div class="form-group">
        <label>Divisi</label>
        <select class="input" id="new-division">
          <option value="">Pilih divisi...</option>
        </select>
      </div>
      <div id="modal-error" style="color:var(--danger);font-size:13px;margin-top:8px;display:none;"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="tutupModal()">Batal</button>
        <button class="btn btn-primary" id="btn-buat-akun" onclick="buatAkunStaff()">
          <i data-lucide="user-plus" style="width:14px;height:14px;"></i> Buat Akun
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Ubah User -->
  <div class="modal-overlay" id="modal-ubah">
    <div class="modal-box">
      <div class="modal-title">Edit Staff</div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:16px;" id="ubah-user-nama"></div>

      <div class="form-group">
        <label>Nama baru (kosongkan jika tidak diubah)</label>
        <input type="text" class="input" id="ubah-nama" placeholder="Nama lengkap">
      </div>
      <div class="form-group">
        <label>Divisi</label>
        <select class="input" id="ubah-division">
          <option value="">Tidak mengubah divisi</option>
        </select>
      </div>
      <div class="form-group">
        <label>Reset password (kosongkan jika tidak diubah)</label>
        <input type="text" class="input" id="ubah-password" placeholder="Password baru min. 6 karakter">
      </div>

      <div id="ubah-error" style="color:var(--danger);font-size:13px;margin-top:4px;display:none;"></div>

      <div class="modal-actions">
        <button class="btn btn-outline" onclick="tutupModalUbah()">Batal</button>
        <button class="btn btn-primary" onclick="simpanUbahUser()">Simpan</button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    requireAuth();
    initSidebarToggle();
    const user = getUser();
    document.getElementById("user-name").textContent = user.nama;

    if (!isManager()) {
      showToast("Akses ditolak — hanya Manager", "error");
      setTimeout(() => window.location.href = "dashboard.html", 1500);
    }

    let divisions    = [];
    let selectedUser = null;
    let allUsers = [];
    let filteredUsers = [];
    let staffCurrentPage = 1;

    const STAFF_PAGE_SIZE = 20;

    const divisionClass = {
      "Manager":       "div-manager",
      "Design Artist": "div-design",
      "3D Modeler":    "div-3d",
      "Animator":      "div-animator",
      "Editor":        "div-editor",
      "Render Artist": "div-render",
      "Custom":        "div-custom",
    };

    async function loadDivisions() {
      try {
        const data = await fetchWithRetry(`${API_BASE_URL}/divisions`);
        divisions = (data.divisions || []).filter(
          d => String(d.nama || "").trim().toLowerCase() !== "custom"
        );

        const sel1 = document.getElementById("new-division");
        const sel2 = document.getElementById("ubah-division");
        const filterSel = document.getElementById("staff-filter-division");

        const opts = divisions.map(
          d => `<option value="${d.id}">${d.nama}</option>`
        ).join("");

        sel1.innerHTML = `<option value="">Pilih divisi...</option>` + opts;
        sel2.innerHTML = `<option value="">Pilih divisi...</option>` + opts;
        filterSel.innerHTML =
          `<option value="">Semua divisi</option>` +
          `<option value="__none__">Belum ada divisi</option>` +
          opts;

      } catch (e) { console.error(e); showToast("Gagal memuat divisi", "error"); }
    }

    async function loadDivisionSummary() {
      try {
        const data = await fetchWithRetry(`${API_BASE_URL}/admin/report/divisions`);
        const infoEl = document.getElementById("division-info");

        const visibleDivisions = (data.divisions || []).filter(
          d => String(d.nama || "").trim().toLowerCase() !== "custom"
        );

        if (!visibleDivisions.length) {
          infoEl.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:10px 0;">Belum ada divisi</div>`;
          return;
        }

        infoEl.innerHTML = visibleDivisions.map(d => `
          <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">
            <span class="user-division ${divisionClass[d.nama] || 'div-none'}" style="flex-shrink:0;">${d.nama}</span>
            <span style="font-size:12px;color:var(--text-muted);flex:1;">${d.jumlah_user} user &bull; ${d.jumlah_aset} aset</span>
            <span style="font-size:12px;color:var(--text-muted);white-space:nowrap;">${formatFileSize(d.total_storage)}</span>
          </div>`).join("");

      } catch (e) {
        document.getElementById("division-info").innerHTML =
          `<div style="font-size:12px;color:var(--danger);padding:10px 0;">Gagal memuat ringkasan divisi</div>`;
      }
    }

    async function loadUsers() {
      try {
        const data = await fetchWithRetry(`${API_BASE_URL}/divisions/users`);
        allUsers = data.users || [];
        staffCurrentPage = 1;
        applyStaffFilters();
      } catch (e) {
        console.error(e);
        document.getElementById("user-list").innerHTML =
          `<div class="user-list-empty">Gagal memuat daftar staff.</div>`;
        document.getElementById("staff-result-count").textContent =
          "Gagal memuat staff";
        showToast("Gagal memuat daftar user", "error");
      }
    }

    function getUserDivisionInfo(u) {
      const div = u.division?.divisions || null;
      return {
        id: div?.id || "",
        nama: div?.nama || ""
      };
    }

    function applyStaffFilters(resetPage = false) {
      if (resetPage) staffCurrentPage = 1;

      const query = document
        .getElementById("staff-search")
        .value
        .trim()
        .toLowerCase();

      const divisionFilter =
        document.getElementById("staff-filter-division").value;

      const sortMode =
        document.getElementById("staff-sort").value;

      filteredUsers = allUsers.filter(u => {
        const nama = String(u.nama || "").toLowerCase();
        const email = String(u.email || "").toLowerCase();
        const div = getUserDivisionInfo(u);

        const matchSearch =
          !query ||
          nama.includes(query) ||
          email.includes(query);

        let matchDivision = true;

        if (divisionFilter === "__none__") {
          matchDivision = !div.id;
        } else if (divisionFilter) {
          matchDivision = div.id === divisionFilter;
        }

        return matchSearch && matchDivision;
      });

      filteredUsers.sort((a, b) => {
        const aDiv = getUserDivisionInfo(a).nama || "ZZZZ";
        const bDiv = getUserDivisionInfo(b).nama || "ZZZZ";
        const aName = String(a.nama || "");
        const bName = String(b.nama || "");

        if (sortMode === "name_desc") {
          return bName.localeCompare(aName, "id");
        }

        if (sortMode === "division_asc") {
          const byDiv = aDiv.localeCompare(bDiv, "id");
          return byDiv || aName.localeCompare(bName, "id");
        }

        if (sortMode === "division_desc") {
          const byDiv = bDiv.localeCompare(aDiv, "id");
          return byDiv || aName.localeCompare(bName, "id");
        }

        return aName.localeCompare(bName, "id");
      });

      renderUsersPage();
    }

    function renderUsersPage() {
      const el = document.getElementById("user-list");
      const total = filteredUsers.length;
      const allTotal = allUsers.length;
      const totalPages = Math.max(1, Math.ceil(total / STAFF_PAGE_SIZE));

      if (staffCurrentPage > totalPages) {
        staffCurrentPage = totalPages;
      }

      if (!total) {
        el.innerHTML = `
          <div class="user-list-empty">
            Tidak ada staff yang cocok dengan pencarian atau filter.
          </div>
        `;

        document.getElementById("staff-result-count").textContent =
          `0 dari ${allTotal} staff`;

        document.getElementById("staff-pagination").style.display = "none";
        return;
      }

      const start = (staffCurrentPage - 1) * STAFF_PAGE_SIZE;
      const end = Math.min(start + STAFF_PAGE_SIZE, total);
      const pageUsers = filteredUsers.slice(start, end);

      el.innerHTML = pageUsers.map(u => {
        const divNama  = u.division?.divisions?.nama || null;
        const divClass = divisionClass[divNama] || "div-none";
        const initial  = String(u.nama || "?").charAt(0).toUpperCase();
        const isSelf   = u.id === user.user_id;

        return `
          <div class="user-item">
            <div class="user-avatar">${initial}</div>

            <div class="user-info">
              <div class="user-nama">
                ${u.nama}
                ${isSelf
                  ? '<span style="font-size:10px;color:var(--text-muted);">(kamu)</span>'
                  : ''}
              </div>
              <div class="user-email">${u.email}</div>
            </div>

            <span class="user-division ${divClass}">
              ${divNama || "Belum ada"}
            </span>

            <div class="user-actions">
              <div
                class="btn-icon"
                title="Edit staff"
                onclick="bukaModalUbah('${u.id}', ${JSON.stringify(String(u.nama || ""))})"
              >
                <i data-lucide="pencil" style="width:13px;height:13px;"></i>
              </div>

              ${!isSelf ? `
                <div
                  class="btn-icon danger"
                  title="Hapus akun"
                  onclick="hapusStaff('${u.id}', ${JSON.stringify(String(u.nama || ""))})"
                >
                  <i data-lucide="trash-2" style="width:13px;height:13px;"></i>
                </div>
              ` : ""}
            </div>
          </div>`;
      }).join("");

      document.getElementById("staff-result-count").textContent =
        total === allTotal
          ? `${allTotal} staff`
          : `${total} dari ${allTotal} staff`;

      renderStaffPagination(totalPages, start, end, total);
      lucide.createIcons();
    }

    function renderStaffPagination(totalPages, start, end, total) {
      const wrap = document.getElementById("staff-pagination");
      const info = document.getElementById("staff-pagination-info");
      const buttons = document.getElementById("staff-pagination-buttons");

      if (totalPages <= 1) {
        wrap.style.display = "none";
        return;
      }

      wrap.style.display = "flex";
      info.textContent = `Menampilkan ${start + 1}–${end} dari ${total} staff`;

      const pageSet = new Set([
        1,
        totalPages,
        staffCurrentPage - 1,
        staffCurrentPage,
        staffCurrentPage + 1
      ]);

      const pages = [...pageSet]
        .filter(page => page >= 1 && page <= totalPages)
        .sort((a, b) => a - b);

      let html = `
        <button
          class="staff-page-btn"
          ${staffCurrentPage === 1 ? "disabled" : ""}
          onclick="goToStaffPage(${staffCurrentPage - 1})"
        >
          Sebelumnya
        </button>
      `;

      let previous = null;

      for (const page of pages) {
        if (previous !== null && page - previous > 1) {
          html += `<span style="font-size:11px;color:var(--text-muted);">…</span>`;
        }

        html += `
          <button
            class="staff-page-btn ${page === staffCurrentPage ? "active" : ""}"
            onclick="goToStaffPage(${page})"
          >
            ${page}
          </button>
        `;

        previous = page;
      }

      html += `
        <button
          class="staff-page-btn"
          ${staffCurrentPage === totalPages ? "disabled" : ""}
          onclick="goToStaffPage(${staffCurrentPage + 1})"
        >
          Berikutnya
        </button>
      `;

      buttons.innerHTML = html;
    }

    function goToStaffPage(page) {
      const totalPages = Math.max(
        1,
        Math.ceil(filteredUsers.length / STAFF_PAGE_SIZE)
      );

      if (page < 1 || page > totalPages) return;

      staffCurrentPage = page;
      renderUsersPage();
    }

    document
      .getElementById("staff-search")
      .addEventListener(
        "input",
        debounce(() => applyStaffFilters(true), 200)
      );

    document
      .getElementById("staff-filter-division")
      .addEventListener(
        "change",
        () => applyStaffFilters(true)
      );

    document
      .getElementById("staff-sort")
      .addEventListener(
        "change",
        () => applyStaffFilters(true)
      );

    function bukaModalBuatAkun() {
      document.getElementById("modal-buat").classList.add("open");
      document.getElementById("modal-error").style.display = "none";
      lucide.createIcons();
    }

    function tutupModal() {
      document.getElementById("modal-buat").classList.remove("open");
      document.getElementById("new-nama").value     = "";
      document.getElementById("new-email").value    = "";
      document.getElementById("new-password").value = "temotion123";
      document.getElementById("new-division").value = "";
    }

    function bukaModalUbah(user_id, nama) {
      selectedUser = user_id;
      document.getElementById("ubah-user-nama").textContent = `Mengubah divisi untuk: ${nama}`;
      document.getElementById("modal-ubah").classList.add("open");
      lucide.createIcons();
    }

    function tutupModalUbah() {
      document.getElementById("modal-ubah").classList.remove("open");
      document.getElementById("ubah-nama").value     = "";
      document.getElementById("ubah-division").value = "";
      document.getElementById("ubah-password").value = "";
      document.getElementById("ubah-error").style.display = "none";
      selectedUser = null;
    }

    async function buatAkunStaff() {
      const nama        = document.getElementById("new-nama").value.trim();
      const email       = document.getElementById("new-email").value.trim();
      const password    = document.getElementById("new-password").value;
      const division_id = document.getElementById("new-division").value;
      const errorEl     = document.getElementById("modal-error");
      const btn         = document.getElementById("btn-buat-akun");

      errorEl.style.display = "none";

      if (!nama || !email || !password || !division_id) {
        errorEl.textContent   = "Semua field wajib diisi";
        errorEl.style.display = "block";
        return;
      }

      btn.textContent = "Memproses...";
      btn.disabled    = true;

      try {
        const res = await fetch(
          `${API_BASE_URL}/auth/register-with-division?division_id=${division_id}`,
          {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({nama, email, password})
          }
        );
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Gagal buat akun");

        tutupModal();
        await loadUsers();
        await loadDivisionSummary();
        showToast(`Akun ${nama} berhasil dibuat`);
      } catch (err) {
        errorEl.textContent   = err.message;
        errorEl.style.display = "block";
      } finally {
        btn.textContent = "Buat Akun";
        btn.disabled    = false;
        lucide.createIcons();
      }
    }

    async function simpanUbahUser() {
      const nama        = document.getElementById("ubah-nama").value.trim();
      const division_id = document.getElementById("ubah-division").value;
      const password    = document.getElementById("ubah-password").value;
      const errorEl     = document.getElementById("ubah-error");

      errorEl.style.display = "none";

      if (password && password.length < 6) {
        errorEl.textContent   = "Password minimal 6 karakter";
        errorEl.style.display = "block";
        return;
      }

      try {
        // Update nama dan/atau password
        if (nama || password) {
          const payload = {};
          if (nama)     payload.nama         = nama;
          if (password) payload.password_baru = password;

          const res = await fetch(`${API_BASE_URL}/admin/users/${selectedUser}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail);
        }

        // Update divisi jika dipilih
        if (division_id) {
          await fetch(`${API_BASE_URL}/divisions/assign?user_id=${selectedUser}&division_id=${division_id}`, {
            method: "POST"
          });
        }

        tutupModalUbah();
        await loadUsers();
        await loadDivisionSummary();
        showToast("Data staff berhasil diupdate");
      } catch (err) {
        errorEl.textContent   = err.message;
        errorEl.style.display = "block";
      }
    }

    async function hapusStaff(staff_id, nama) {
      if (!confirm(`Hapus akun "${nama}"? Semua aset milik akun ini juga akan dihapus. Tindakan tidak bisa dibatalkan.`)) return;
      try {
        const res  = await fetch(`${API_BASE_URL}/admin/users/${staff_id}`, {method: "DELETE"});
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Gagal menghapus akun");
        await loadUsers();
        await loadDivisionSummary();
        showToast(`Akun ${nama} berhasil dihapus`);
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    loadDivisions();
    loadDivisionSummary();
    loadUsers();
    lucide.createIcons();
  </script>
</body>
</html>
