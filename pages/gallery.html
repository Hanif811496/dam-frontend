<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — DAM</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .gallery-wrap {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .filter-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      position: sticky;
      top: calc(var(--navbar-h) + 28px);
    }

    .filter-panel-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .filter-section { margin-bottom: 20px; }

    .filter-section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .filter-clear {
      font-size: 11px;
      color: var(--primary);
      cursor: pointer;
      font-weight: 500;
    }

    .filter-clear:hover { text-decoration: underline; }

    .tipe-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tipe-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }

    .tipe-item:hover { background: var(--surface-2); color: var(--text); }
    .tipe-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .tipe-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .tag-filter-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 200px;
      overflow-y: auto;
    }

    .tag-filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: var(--radius-md);
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.12s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag-filter-item:hover { background: var(--surface-2); color: var(--text); }
    .tag-filter-item.active { background: var(--accent-yellow-light); color: #7a600a; font-weight: 600; }
    .tag-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-yellow); flex-shrink: 0; }

    .explorer-pane { min-width: 0; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .toolbar .input { flex: 1; min-width: 220px; }

    .view-toggle {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 2px;
      flex-shrink: 0;
    }

    .view-btn {
      border: 0;
      background: transparent;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .view-btn.active {
      background: var(--surface);
      color: var(--primary);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .division-zone { margin-bottom: 18px; }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .division-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 10px;
    }

    .division-card {
      appearance: none;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s, background 0.15s;
      color: var(--text);
    }

    .division-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .division-card.active {
      border-color: var(--accent-blue);
      background: rgba(33, 118, 214, 0.06);
    }

    .division-card.shared:hover { border-color: #2e7d32; }
    .division-card.shared.active {
      border-color: #2e7d32;
      background: rgba(46, 125, 50, 0.06);
    }

    .division-card-info { min-width: 0; flex: 1; }

    .division-card-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .division-card-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .active-filter-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      background: var(--surface-2);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-full);
      font-size: 12px;
      color: var(--text-muted);
    }

    .active-filter-badge span { cursor: pointer; color: var(--primary); font-size: 14px; }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .breadcrumb-item {
      color: var(--primary);
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .breadcrumb-item:hover { text-decoration: underline; }
    .breadcrumb-sep { color: var(--text-light); }
    .breadcrumb-current { color: var(--text-muted); font-weight: 600; }

    .bulk-toolbar {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-lg);
      padding: 9px 10px 9px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
    }

    .bulk-toolbar.visible { display: flex; }

    .bulk-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-right: auto;
      white-space: nowrap;
    }

    .bulk-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: var(--radius-md);
      padding: 7px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .bulk-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .bulk-btn.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
    .bulk-btn:disabled { opacity: 0.38; cursor: not-allowed; }

    .result-row {
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .result-info { font-size: 12px; color: var(--text-muted); }

    .select-all-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .select-all-label input,
    .item-checkbox,
    .list-checkbox {
      accent-color: var(--primary);
      cursor: pointer;
    }

    .drive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .drive-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s, background 0.15s;
      min-width: 0;
    }

    .drive-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .drive-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
      background: rgba(216, 35, 42, 0.02);
    }

    .item-checkbox-wrap {
      position: absolute;
      top: 9px;
      right: 9px;
      z-index: 4;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .item-checkbox { width: 15px; height: 15px; margin: 0; }

    .asset-preview {
      width: 100%;
      height: 132px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      overflow: hidden;
    }

    .asset-preview img { width: 100%; height: 132px; object-fit: cover; }

    .folder-preview {
      height: 132px;
      background: linear-gradient(180deg, var(--surface-2), var(--surface));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .smart-badge {
      position: absolute;
      left: 10px;
      top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: var(--radius-full);
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 700;
      color: #7a600a;
      background: var(--accent-yellow-light);
      border: 1px solid rgba(244, 184, 0, 0.35);
    }

    .drive-card-body { padding: 11px 12px 12px; }

    .drive-card-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .drive-card-meta {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .drive-card-owner {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-drive-card .item-checkbox-wrap {
      right: 44px;
    }

    .folder-more-btn,
    .list-more-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.96);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .12s, color .12s, border-color .12s;
    }

    .folder-more-btn {
      position: absolute;
      top: 9px;
      right: 9px;
      z-index: 5;
      width: 27px;
      height: 27px;
      border-radius: 7px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .folder-more-btn:hover,
    .list-more-btn:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border-dark);
    }

    .list-more-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      justify-self: end;
    }

    .folder-context-menu {
      display: none;
      position: fixed;
      z-index: 3200;
      width: 190px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 14px 38px rgba(0,0,0,.16);
    }

    .folder-context-menu.open { display: block; }

    .folder-context-item {
      width: 100%;
      appearance: none;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 7px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }

    .folder-context-item:hover { background: var(--surface-2); }
    .folder-context-item i { width: 15px; height: 15px; color: var(--text-muted); }
    .folder-context-separator { height: 1px; background: var(--border); margin: 5px 4px; }

    .folder-detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 3500;
      background: rgba(0,0,0,.20);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .folder-detail-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .folder-detail-drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: min(430px, 92vw);
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -18px 0 45px rgba(0,0,0,.12);
      transform: translateX(100%);
      transition: transform .20s ease;
      display: flex;
      flex-direction: column;
    }

    .folder-detail-overlay.open .folder-detail-drawer {
      transform: translateX(0);
    }

    .folder-detail-head {
      padding: 18px 18px 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .folder-detail-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent-yellow-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b18400;
      flex-shrink: 0;
    }

    .folder-detail-title-wrap { flex: 1; min-width: 0; }

    .folder-detail-kicker {
      font-size: 10px;
      font-weight: 700;
      color: #8a6b00;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 3px;
    }

    .folder-detail-title {
      font-size: 18px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-detail-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .folder-detail-close {
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .folder-detail-close:hover { background: var(--surface-2); }

    .folder-detail-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 24px;
    }

    .folder-detail-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .folder-detail-section {
      margin-bottom: 20px;
    }

    .folder-detail-section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }

    .folder-detail-table {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .folder-detail-row {
      display: grid;
      grid-template-columns: 130px minmax(0,1fr);
      gap: 12px;
      padding: 10px 11px;
      border-bottom: 1px solid var(--border);
      font-size: 11.5px;
      line-height: 1.4;
    }

    .folder-detail-row:last-child { border-bottom: 0; }
    .folder-detail-label { color: var(--text-muted); }
    .folder-detail-value { color: var(--text); word-break: break-word; }

    .folder-detail-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 8px;
    }

    .folder-detail-stat {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 10px;
      background: var(--surface-2);
    }

    .folder-detail-stat-value {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .folder-detail-stat-label {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .folder-detail-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .folder-detail-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: var(--radius-full);
      padding: 5px 9px;
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .folder-detail-empty {
      border: 1px dashed var(--border-dark);
      border-radius: 10px;
      padding: 14px;
      color: var(--text-light);
      font-size: 11px;
      text-align: center;
    }

    .folder-detail-loading {
      display: flex;
      justify-content: center;
      padding: 50px 10px;
    }

    .drive-list {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--surface);
    }

    .list-row {
      display: grid;
      grid-template-columns: 34px minmax(260px, 1.5fr) minmax(120px, 0.7fr) minmax(120px, 0.7fr) 100px 110px 34px;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }

    .list-row:last-child { border-bottom: 0; }

    .list-head {
      min-height: 42px;
      background: var(--surface-2);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: default;
    }

    .list-item { cursor: pointer; transition: background 0.12s; }
    .list-item:hover { background: var(--surface-2); }
    .list-item.selected { background: var(--primary-light); }

    .list-name {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .list-name-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }

    .list-muted {
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      padding: 55px 20px;
      text-align: center;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border-dark);
      border-radius: var(--radius-lg);
    }

    .dam-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.36);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .dam-modal-backdrop.open { display: flex; }

    .dam-modal {
      width: min(460px, 100%);
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      overflow: hidden;
    }

    .dam-modal-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dam-modal-title { font-size: 17px; font-weight: 700; }

    .modal-close {
      border: 0;
      background: transparent;
      cursor: pointer;
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover { background: var(--surface-2); }

    .dam-modal-body { padding: 18px 20px; }
    .dam-modal-foot {
      padding: 12px 20px 18px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .modal-help {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .modal-field + .modal-field { margin-top: 14px; }

    @media (max-width: 1100px) {
      .list-row {
        grid-template-columns: 34px minmax(220px, 1.5fr) minmax(110px, 0.7fr) 90px 100px 34px;
      }
      .list-col-division { display: none; }
    }

    @media (max-width: 768px) {
      .gallery-wrap { grid-template-columns: 1fr; }
      .filter-panel { position: static; }
      .division-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); }
      .drive-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .list-row { grid-template-columns: 30px minmax(180px, 1fr) 90px 34px; }
      .list-col-owner, .list-col-division, .list-col-date { display: none; }
      .bulk-count { width: 100%; margin-right: 0; }
    }
  </style>
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <nav class="navbar">
    <button class="sidebar-toggle-btn" id="sidebar-toggle" title="Tampilkan/sembunyikan sidebar">
      <i data-lucide="panel-left"></i>
    </button>
    <div class="navbar-brand">DAM System</div>
    <div class="navbar-right">
      <span id="user-name" style="font-size:14px;color:var(--text-muted);"></span>

  <script>
    requireAuth();
    initSidebarToggle();

    const user = getUser();
    hydrateTopbarUser();

    if (isManager()) {
      document.getElementById("sidebar-admin-label").style.display = "block";
      document.getElementById("sidebar-users").style.display = "flex";
      document.getElementById("sidebar-dashboard").style.display = "flex";
    }

    let allAssets = [];
    let allFolders = [];
    let allDivisions = [];
    let sharedAssetShares = [];
    let activeTipe = "";
    let activeTag = "";
    let tagAssetIds = null;
    let searchTagAssetIds = null;
    let searchRequestSeq = 0;
    let viewMode = localStorage.getItem("dam_gallery_view") || "grid";
    let navStack = [];
    let currentRawAssets = [];
    let currentRawFolders = [];
    let visibleAssets = [];
    let visibleFolders = [];
    const selectedItems = new Map();

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeName(value) {
      return String(value || "").trim().toLowerCase();
    }

    function isCustomFolder(folder) {
      return folder.type === "system" && normalizeName(folder.nama) === "custom";
    }

    function getSystemFolders() {
      return allFolders
        .filter(folder => folder.type === "system" && !isCustomFolder(folder))
        .sort((a, b) => a.nama.localeCompare(b.nama, "id"));
    }

    function getSmartFolders() {
      return allFolders.filter(folder => folder.type === "smart");
    }

    function getLegacySharedFolders() {
      return allFolders.filter(folder => folder.type === "shared");
    }

    function getSharedSmartFolders() {
      return getSmartFolders().filter(folder => folder.shared_to_me === true);
    }

    function currentLocation() {
      return navStack.length ? navStack[navStack.length - 1] : { type: "root", name: "Gallery" };
    }

    function itemKey(kind, id) {
      return `${kind}:${id}`;
    }

    function getFileIcon(tipe = "") {
      if (tipe.includes("image")) return "🖼️";
      if (tipe.includes("video")) return "🎬";
      if (tipe.includes("pdf")) return "📄";
      if (tipe.includes("word") || tipe.includes("document")) return "📝";
      if (tipe.includes("spreadsheet") || tipe.includes("excel")) return "📊";
      return "📦";
    }

    function setView(mode) {
      viewMode = mode;
      localStorage.setItem("dam_gallery_view", mode);
      document.getElementById("btn-grid").classList.toggle("active", mode === "grid");
      document.getElementById("btn-list").classList.toggle("active", mode === "list");
      renderVisibleItems();
    }

    function renderDivisionStrip() {
      const grid = document.getElementById("division-grid");
      const location = currentLocation();
      const sharedCount = sharedAssetShares.length + getSharedSmartFolders().length;

      const sharedCard = `
        <button class="division-card shared ${location.type === "shared" ? "active" : ""}" type="button" onclick="openShared()">
          <i data-lucide="users-round" style="width:27px;height:27px;color:#2e7d32;flex-shrink:0;"></i>
          <span class="division-card-info">
            <span class="division-card-name">Shared with me</span>
            <span class="division-card-subtitle">${sharedCount} item dibagikan</span>
          </span>
        </button>`;

      const folderCards = getSystemFolders().map(folder => {
        const active = location.type === "folder" && location.id === folder.id;
        return `
          <button class="division-card ${active ? "active" : ""}" type="button" onclick="openDivision('${folder.id}')">
            <i data-lucide="folder" style="width:27px;height:27px;color:var(--accent-blue);flex-shrink:0;"></i>
            <span class="division-card-info">
              <span class="division-card-name">${escapeHtml(folder.nama)}</span>
            </span>
          </button>`;
      }).join("");

      grid.innerHTML = sharedCard + folderCards;
      lucide.createIcons();
    }

    function renderBreadcrumb() {
      const el = document.getElementById("breadcrumb");
      let html = `
        <span class="breadcrumb-item" onclick="goHome()">
          <i data-lucide="home" style="width:13px;height:13px;"></i> Gallery
        </span>`;

      navStack.forEach((item, index) => {
        const isLast = index === navStack.length - 1;
        html += `<span class="breadcrumb-sep">/</span>`;
        html += isLast
          ? `<span class="breadcrumb-current">${escapeHtml(item.name)}</span>`
          : `<span class="breadcrumb-item" onclick="goBreadcrumb(${index})">${escapeHtml(item.name)}</span>`;
      });

      el.innerHTML = html;
      lucide.createIcons();
    }

    function renderActiveFilters() {
      const el = document.getElementById("active-filters");
      let html = "";

      if (activeTipe) {
        const label = { image: "Gambar", video: "Video", pdf: "PDF" }[activeTipe] || activeTipe;
        html += `<div class="active-filter-badge">Tipe: ${escapeHtml(label)} <span onclick="clearTipe()">×</span></div>`;
      }

      if (activeTag) {
        html += `<div class="active-filter-badge">Tag: ${escapeHtml(activeTag)} <span onclick="clearTag()">×</span></div>`;
      }

      el.innerHTML = html;
    }

    function normalizeSharedAsset(share) {
      if (!share || !share.assets) return null;
      const sender = share.users?.nama || share.from_user?.nama || share.shared_by || "—";
      return {
        ...share.assets,
        shared_by: sender,
        shared_note: share.catatan || "",
        share_id: share.id,
        is_shared_asset: true,
      };
    }

    function dedupeAssets(assets) {
      const map = new Map();
      assets.filter(Boolean).forEach(asset => {
        if (!map.has(asset.id)) map.set(asset.id, asset);
      });
      return Array.from(map.values());
    }

    async function loadLocationData() {
      const content = document.getElementById("content-area");
      content.innerHTML = `<div style="display:flex;justify-content:center;padding:40px;"><div class="spinner"></div></div>`;
      document.getElementById("select-all-wrap").style.display = "none";

      const location = currentLocation();

      try {
        if (location.type === "root") {
          currentRawAssets = [...allAssets];
          // Root Gallery hanya menampilkan aset. Smart Folder hidup di bawah
          // Folder Divisi agar hierarchy konsisten seperti Explorer/Drive.
          currentRawFolders = [];
        } else if (location.type === "shared") {
          const directShared = sharedAssetShares.map(normalizeSharedAsset).filter(Boolean);
          const legacyFolders = getLegacySharedFolders();
          const legacyResponses = await Promise.allSettled(
            legacyFolders.map(folder => getFolderAssets(folder.id, user.user_id))
          );
          const legacyAssets = legacyResponses.flatMap(result =>
            result.status === "fulfilled" ? (result.value.assets || []) : []
          );

          currentRawAssets = dedupeAssets([...directShared, ...legacyAssets]);
          currentRawFolders = getSharedSmartFolders();
        } else if (location.type === "folder") {
          const response = await getFolderAssets(location.id, user.user_id);
          currentRawAssets = response.assets || [];

          if (location.folderType === "system") {
            currentRawFolders = getSmartFolders().filter(folder => {
              if (folder.shared_to_me) return false;

              // Folder baru: parent_id menunjuk langsung ke system folder.
              const nestedUnderSystemFolder = folder.parent_id === location.id;

              // Folder legacy: dibuat sebelum nested hierarchy, sehingga
              // parent_id masih null tetapi division_id sudah menunjuk divisi.
              const legacyDivisionRoot =
                !folder.parent_id &&
                folder.division_id === location.division_id;

              return nestedUnderSystemFolder || legacyDivisionRoot;
            });
          } else {
            currentRawFolders = getSmartFolders().filter(folder => folder.parent_id === location.id);
          }
        }

        applyFiltersAndRender();
      } catch (error) {
        currentRawAssets = [];
        currentRawFolders = [];
        content.innerHTML = `
          <div class="empty-state">
            <i data-lucide="wifi-off" style="width:42px;height:42px;opacity:0.3;margin:0 auto 12px;display:block;"></i>
            <p style="color:var(--danger);">Gagal memuat isi: ${escapeHtml(error.message)}</p>
            <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="loadLocationData()">Coba Lagi</button>
          </div>`;
        document.getElementById("result-info").textContent = "";
        lucide.createIcons();
      }
    }

    function applyFiltersAndRender() {
      const q = document.getElementById("search-input").value.trim().toLowerCase();
      const sort = document.getElementById("sort-by").value;

      visibleFolders = currentRawFolders.filter(folder => {
        if (!q) return true;
        return normalizeName(folder.nama).includes(q);
      });

      visibleAssets = currentRawAssets.filter(asset => {
        const matchName = !q || normalizeName(asset.nama_file).includes(q);
        const matchSearchTag = !q || (searchTagAssetIds || []).includes(asset.id);
        const matchQ = !q || matchName || matchSearchTag;
        const matchTipe = activeTipe ? String(asset.tipe_file || "").includes(activeTipe) : true;
        const matchTag = activeTag ? (tagAssetIds || []).includes(asset.id) : true;
        return matchQ && matchTipe && matchTag;
      });

      visibleFolders.sort((a, b) => a.nama.localeCompare(b.nama, "id"));

      if (sort === "oldest") visibleAssets.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      if (sort === "newest") visibleAssets.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      if (sort === "largest") visibleAssets.sort((a, b) => (b.ukuran || 0) - (a.ukuran || 0));
      if (sort === "smallest") visibleAssets.sort((a, b) => (a.ukuran || 0) - (b.ukuran || 0));
      if (sort === "name") visibleAssets.sort((a, b) => a.nama_file.localeCompare(b.nama_file, "id"));

      reconcileSelection();
      renderActiveFilters();
      renderVisibleItems();
    }

    function reconcileSelection() {
      const visibleKeys = new Set([
        ...visibleFolders.map(folder => itemKey("folder", folder.id)),
        ...visibleAssets.map(asset => itemKey("asset", asset.id)),
      ]);

      for (const key of selectedItems.keys()) {
        if (!visibleKeys.has(key)) selectedItems.delete(key);
      }
    }

    function renderVisibleItems() {
      const content = document.getElementById("content-area");
      const total = visibleFolders.length + visibleAssets.length;
      const location = currentLocation();

      document.getElementById("btn-grid").classList.toggle("active", viewMode === "grid");
      document.getElementById("btn-list").classList.toggle("active", viewMode === "list");
      document.getElementById("result-info").textContent = `${visibleFolders.length} folder · ${visibleAssets.length} aset`;
      document.getElementById("select-all-wrap").style.display = total ? "inline-flex" : "none";

      if (!total) {
        content.innerHTML = `
          <div class="empty-state">
            <i data-lucide="folder-open" style="width:48px;height:48px;opacity:0.3;margin:0 auto 12px;display:block;"></i>
            <p>${location.type === "shared" ? "Belum ada item yang dibagikan ke divisi kamu." : "Tidak ada file atau folder di lokasi ini."}</p>
          </div>`;
        updateBulkToolbar();
        lucide.createIcons();
        return;
      }

      content.innerHTML = viewMode === "grid" ? renderGrid() : renderList();
      syncSelectAllCheckbox();
      updateBulkToolbar();
      lucide.createIcons();
    }

    function renderGrid() {
      const folderHtml = visibleFolders.map(folder => renderFolderCard(folder)).join("");
      const assetHtml = visibleAssets.map(asset => renderAssetCard(asset)).join("");
      return `<div class="drive-grid">${folderHtml}${assetHtml}</div>`;
    }

    function renderFolderCard(folder) {
      const key = itemKey("folder", folder.id);
      const checked = selectedItems.has(key);
      const subtitle = folder.shared_by
        ? `Dibagikan oleh ${folder.shared_by}`
        : `Smart Folder${folder.div_nama ? ` · ${folder.div_nama}` : ""}`;

      return `
        <div class="drive-card folder-drive-card ${checked ? "selected" : ""}" onclick="openSmartFolder('${folder.id}')">
          <label class="item-checkbox-wrap" onclick="event.stopPropagation();">
            <input class="item-checkbox" type="checkbox" ${checked ? "checked" : ""}
              onchange="toggleSelection('folder','${folder.id}',this.checked)" aria-label="Pilih folder ${escapeHtml(folder.nama)}">
          </label>
          <button class="folder-more-btn" type="button" title="Aksi folder"
            onclick="event.stopPropagation();openFolderMenu(event,'${folder.id}')">
            <i data-lucide="more-vertical" style="width:15px;height:15px;"></i>
          </button>
          <div class="folder-preview">
            <span class="smart-badge"><i data-lucide="zap" style="width:10px;height:10px;"></i> SMART</span>
            <i data-lucide="folder" style="width:58px;height:58px;color:var(--accent-yellow);"></i>
          </div>
          <div class="drive-card-body">
            <div class="drive-card-name">${escapeHtml(folder.nama)}</div>
            <div class="drive-card-meta">${escapeHtml(subtitle)}</div>
            <div class="drive-card-owner">
              <i data-lucide="user" style="width:10px;height:10px;"></i>
              ${escapeHtml(folder.owner || folder.shared_by || "—")}
            </div>
          </div>
        </div>`;
    }

    function renderAssetCard(asset) {
      const key = itemKey("asset", asset.id);
      const checked = selectedItems.has(key);
      const isImage = String(asset.tipe_file || "").includes("image");
      const preview = isImage
        ? `<div class="asset-preview"><img src="${escapeHtml(asset.url)}" alt="${escapeHtml(asset.nama_file)}" loading="lazy"></div>`
        : `<div class="asset-preview">${getFileIcon(asset.tipe_file || "")}</div>`;
      const owner = asset.shared_by ? `Dibagikan oleh ${asset.shared_by}` : (asset.uploader || "—");

      return `
        <div class="drive-card ${checked ? "selected" : ""}" onclick="openDetailPanel('${asset.id}', 'onAssetDeletedGallery')">
          <label class="item-checkbox-wrap" onclick="event.stopPropagation();">
            <input class="item-checkbox" type="checkbox" ${checked ? "checked" : ""}
              onchange="toggleSelection('asset','${asset.id}',this.checked)" aria-label="Pilih aset ${escapeHtml(asset.nama_file)}">
          </label>
          ${preview}

    function renderFolderRow(folder) {
      const key = itemKey("folder", folder.id);

      return `
        <div class="list-row list-item ${checked ? "selected" : ""}" onclick="openSmartFolder('${folder.id}')">

    function getAssetDivisionName(asset) {
      if (!asset) return "—";

      // Prioritaskan nama divisi yang memang sudah dikirim backend.
      if (asset.div_nama) return asset.div_nama;
      if (asset.uploader_divisi) return asset.uploader_divisi;
      if (asset.division_nama) return asset.division_nama;

      // Sebagian endpoint hanya mengirim division_id. Gallery sudah memuat
      // daftar divisi, jadi resolve nama divisi di frontend agar List View
      // tidak menampilkan "—".
      if (asset.division_id) {
        const division = allDivisions.find(item => item.id === asset.division_id);
        if (division?.nama) return division.nama;
      }

      // Untuk asset yang dibagikan, sumber tetap berasal dari divisi pemilik asset.
      // Jika data divisi tidak tersedia sama sekali, baru tampilkan placeholder.
      return "—";
    }

    function renderAssetRow(asset) {
      const key = itemKey("asset", asset.id);
      const checked = selectedItems.has(key);
      const owner = asset.shared_by ? `Shared · ${asset.shared_by}` : (asset.uploader || "—");
      const division = getAssetDivisionName(asset);

      return `
        <div class="list-row list-item ${checked ? "selected" : ""}" onclick="openDetailPanel('${asset.id}', 'onAssetDeletedGallery')">
          <div onclick="event.stopPropagation();">
            <input class="list-checkbox" type="checkbox" ${checked ? "checked" : ""} onchange="toggleSelection('asset','${asset.id}',this.checked)">
          </div>
          <div class="list-name">
            <span style="font-size:18px;line-height:1;">${getFileIcon(asset.tipe_file || "")}</span>

          <div class="list-muted list-col-division">${escapeHtml(division)}</div>
          <div class="list-muted">${formatFileSize(asset.ukuran || 0)}</div>

    function findVisibleItem(kind, id) {
      if (kind === "asset") return visibleAssets.find(asset => asset.id === id);
      if (kind === "folder") return visibleFolders.find(folder => folder.id === id);
      return null;
    }

    function toggleSelection(kind, id, checked) {
      const key = itemKey(kind, id);
      const data = findVisibleItem(kind, id);
      if (!data) return;

      if (checked) selectedItems.set(key, { kind, data });
      else selectedItems.delete(key);

      renderVisibleItems();
    }

    function isAllVisibleSelected() {
      const keys = [
        ...visibleFolders.map(folder => itemKey("folder", folder.id)),
        ...visibleAssets.map(asset => itemKey("asset", asset.id)),
      ];
      return keys.length > 0 && keys.every(key => selectedItems.has(key));
    }

    function toggleSelectAll(checked) {
      const items = [
        ...visibleFolders.map(data => ({ kind: "folder", data })),
        ...visibleAssets.map(data => ({ kind: "asset", data })),
      ];

      items.forEach(item => {
        const key = itemKey(item.kind, item.data.id);
        if (checked) selectedItems.set(key, item);
        else selectedItems.delete(key);
      });

      renderVisibleItems();
    }

    function updateBulkToolbar() {
      const toolbar = document.getElementById("bulk-toolbar");
      const total = selectedItems.size;

      toolbar.classList.toggle("visible", total > 0);
      document.getElementById("bulk-count").textContent = `${total} item dipilih`;

      const deleteAllowed = assetOnly && (isManager() || assets.every(asset => asset.user_id === user.user_id));

      const shareAllowed = total > 0 && (isManager() || folders.every(folder => folder.user_id === user.user_id));

      document.getElementById("bulk-share").title = shareAllowed

      document.getElementById("bulk-download").disabled = !assetOnly;

      if (top + estimatedHeight > window.innerHeight - 10) {

    function folderPath(folder) {
      if (!folder) return "—";

      const names = [];
      const seen = new Set();
      let current = folder;

      while (current && !seen.has(current.id)) {
        seen.add(current.id);
        names.unshift(current.nama);

        if (!current.parent_id) break;
        current = allFolders.find(item => item.id === current.parent_id);
      }

      if (names.length === 1 && folder.div_nama && folder.type === "smart") {
        names.unshift(folder.div_nama);
      }

      return names.join(" > ");
    }

    function descendantFolders(folderId) {
      const result = [];
      const queue = [folderId];
      const visited = new Set([folderId]);

      while (queue.length) {
        const parentId = queue.shift();
        const children = allFolders.filter(
          folder => folder.type === "smart" && folder.parent_id === parentId
        );

        for (const child of children) {
          if (visited.has(child.id)) continue;
          visited.add(child.id);
          result.push(child);
          queue.push(child.id);
        }
      }

      return result;
    }

    function formatFolderDate(value) {
      if (!value) return "—";
      try {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "—";
        return new Intl.DateTimeFormat("id-ID", {
          day: "numeric",
          month: "long",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      } catch (_) {
        return "—";
      }
    }

    async function openFolderDetail(folderId) {
      const folder = allFolders.find(item => item.id === folderId);
      if (!folder) return;

      closeFolderMenu();

      document.getElementById("folder-detail-title").textContent = folder.nama;
      document.getElementById("folder-detail-subtitle").textContent =
        folder.shared_by
          ? `Dibagikan oleh ${folder.shared_by}`
          : `Smart Folder${folder.div_nama ? ` · ${folder.div_nama}` : ""}`;

      const content = document.getElementById("folder-detail-content");
      content.innerHTML = `<div class="folder-detail-loading"><div class="spinner"></div></div>`;

      document.getElementById("folder-detail-overlay").classList.add("open");
      document.body.style.overflow = "hidden";
      lucide.createIcons();

      try {
        const directChildren = allFolders.filter(
          item => item.type === "smart" && item.parent_id === folder.id
        );

        const descendants = descendantFolders(folder.id);
        const hierarchyFolderIds = [folder.id, ...descendants.map(item => item.id)];

        const [directAssetResult, rulesResult, divisionsResult, ...nestedAssetResults] =
          await Promise.all([
            getFolderAssets(folder.id, user.user_id).catch(() => ({ assets: [] })),
            getFolderRules(user.user_id, folder.id).catch(() => ({ rules: [] })),
            getFolderDivisions(folder.id).catch(() => ({ divisions: [] })),
            ...descendants.map(item =>
              getFolderAssets(item.id, user.user_id).catch(() => ({ assets: [] }))
            )
          ]);

        const directAssets = directAssetResult.assets || [];

        const nestedAssets = nestedAssetResults.flatMap(result => result.assets || []);
        const totalAssetMap = new Map();

        [...directAssets, ...nestedAssets].forEach(asset => {
          if (asset?.id) totalAssetMap.set(asset.id, asset);
        });

        const rules = (rulesResult.rules || []).filter(
          rule => !rule.folder_id || rule.folder_id === folder.id
        );

        const divisions = divisionsResult.divisions || [];

        const canShare = canManageFolder(folder);
        const typeLabel = folder.type === "smart" ? "Smart Folder" : "Folder";
        const owner = folder.shared_by
          ? `Dibagikan oleh ${folder.shared_by}`
          : (folder.owner || "—");

        const sharedText = folder.shared_to_me
          ? `Ya${folder.shared_by ? `, oleh ${folder.shared_by}` : ""}`
          : "Tidak";

        content.innerHTML = `
          <div class="folder-detail-actions">
            <button class="btn btn-primary btn-sm" type="button" onclick="closeFolderDetail();openSmartFolder('${folder.id}')">
              <i data-lucide="folder-open" style="width:14px;height:14px;"></i> Buka
            </button>
            ${canShare ? `
              <button class="btn btn-outline btn-sm" type="button" onclick="shareFolderFromDetail('${folder.id}')">
                <i data-lucide="share-2" style="width:14px;height:14px;"></i> Bagikan
              </button>` : ""}
          </div>

          <section class="folder-detail-section">
            <div class="folder-detail-section-title">Isi</div>
            <div class="folder-detail-stat-grid">
              <div class="folder-detail-stat">
                <div class="folder-detail-stat-value">${directAssets.length}</div>
                <div class="folder-detail-stat-label">Aset langsung</div>
              </div>
              <div class="folder-detail-stat">
                <div class="folder-detail-stat-value">${directChildren.length}</div>
                <div class="folder-detail-stat-label">Subfolder langsung</div>
              </div>
              <div class="folder-detail-stat">
                <div class="folder-detail-stat-value">${totalAssetMap.size}</div>
                <div class="folder-detail-stat-label">Total aset nested</div>
              </div>
            </div>
          </section>

          <section class="folder-detail-section">
            <div class="folder-detail-section-title">Informasi</div>
            <div class="folder-detail-table">
              <div class="folder-detail-row">
                <div class="folder-detail-label">Nama</div>
                <div class="folder-detail-value">${escapeHtml(folder.nama)}</div>
              </div>
              <div class="folder-detail-row">
                <div class="folder-detail-label">Tipe</div>
                <div class="folder-detail-value">${escapeHtml(typeLabel)}</div>
              </div>
              <div class="folder-detail-row">
                <div class="folder-detail-label">Dibuat oleh</div>
                <div class="folder-detail-value">${escapeHtml(owner)}</div>
              </div>
              <div class="folder-detail-row">
                <div class="folder-detail-label">Dibuat</div>
                <div class="folder-detail-value">${escapeHtml(formatFolderDate(folder.created_at))}</div>
              </div>
              <div class="folder-detail-row">
                <div class="folder-detail-label">Terakhir diubah</div>
                <div class="folder-detail-value">${escapeHtml(formatFolderDate(folder.updated_at))}</div>
              </div>
              <div class="folder-detail-row">
                <div class="folder-detail-label">Lokasi</div>
                <div class="folder-detail-value">${escapeHtml(folderPath(folder))}</div>
              </div>
              <div class="folder-detail-row">
                <div class="folder-detail-label">Jumlah folder nested</div>
                <div class="folder-detail-value">${descendants.length}</div>
              </div>
              <div class="folder-detail-row">
                <div class="folder-detail-label">Dibagikan ke saya</div>
                <div class="folder-detail-value">${escapeHtml(sharedText)}</div>
              </div>
            </div>
          </section>

          <section class="folder-detail-section">
            <div class="folder-detail-section-title">Akses Divisi</div>
            ${divisions.length
              ? `<div class="folder-detail-chips">
                  ${divisions.map(div => `
                    <span class="folder-detail-chip">
                      <i data-lucide="users" style="width:11px;height:11px;"></i>
                      ${escapeHtml(div.nama || "Divisi")}
                    </span>`).join("")}
                </div>`
              : `<div class="folder-detail-empty">${escapeHtml(folder.div_nama || "Belum ada data akses divisi.")}</div>`
            }
          </section>

          <section class="folder-detail-section">
            <div class="folder-detail-section-title">Rules Auto-Assign</div>
            ${rules.length
              ? `<div class="folder-detail-chips">
                  ${rules.map(rule => `
                    <span class="folder-detail-chip">
                      <i data-lucide="tag" style="width:11px;height:11px;"></i>
                      ${escapeHtml(rule.keyword || "—")}
                    </span>`).join("")}
                </div>`
              : `<div class="folder-detail-empty">Belum ada Rules Auto-Assign.</div>`
            }

        `;

        lucide.createIcons();
      } catch (error) {

            Gagal memuat detail folder: ${escapeHtml(error.message)}

    async function executeShare() {
      const divisionId = document.getElementById("share-division").value;
      if (!divisionId) return;

      const note = document.getElementById("share-note").value.trim() || null;
      const button = document.getElementById("share-submit");
      button.disabled = true;
      button.textContent = "Membagikan...";

      const jobs = [
        ...selectedAssets().map(asset => shareAssetToDivision(asset.id, user.user_id, divisionId, note)),
        ...selectedFolders().map(folder => shareFolderToDivision(folder.id, user.user_id, divisionId)),
      ];

      const results = await Promise.allSettled(jobs);
      const success = results.filter(result => result.status === "fulfilled").length;
      const failed = results.length - success;

      button.disabled = false;
      button.textContent = "Bagikan";
      closeModal("share-modal");

      if (success) showToast(`${success} item berhasil dibagikan`, "success");
      if (failed) {
        const firstError = results.find(result => result.status === "rejected")?.reason?.message || "Sebagian item gagal dibagikan";
        showToast(`${failed} item gagal: ${firstError}`, "error");
      }

      clearSelection(false);
      await loadAll(false);
    }

    function getMoveDestinations() {
      const location = currentLocation();
      return allFolders
        .filter(folder => ["system", "smart"].includes(folder.type))
        .filter(folder => !isCustomFolder(folder))
        .filter(folder => folder.id !== location.id)
        .filter(folder => !folder.shared_to_me || folder.user_id === user.user_id)
        .sort((a, b) => {
          if (a.type !== b.type) return a.type === "system" ? -1 : 1;
          return a.nama.localeCompare(b.nama, "id");
        });
    }

    function openMoveModal() {
      const assets = selectedAssets();
      if (!assets.length || selectedFolders().length) return;

      const destinations = getMoveDestinations();
      document.getElementById("move-summary").textContent =
        `${assets.length} aset akan dipindahkan ke folder tujuan. Jika kamu sedang berada di sebuah folder, aset akan dikeluarkan dari folder saat ini.`;

      const select = document.getElementById("move-destination");
      select.innerHTML = destinations.length
        ? destinations.map(folder => {
            const prefix = folder.type === "system" ? "Divisi" : "Smart";
            return `<option value="${folder.id}">${prefix} · ${escapeHtml(folder.nama)}</option>`;
          }).join("")
        : `<option value="">Tidak ada folder tujuan</option>`;

      document.getElementById("move-submit").disabled = !destinations.length;
      openModal("move-modal");
    }

    async function executeMove() {
      const destinationId = document.getElementById("move-destination").value;
      if (!destinationId) return;

      const assets = selectedAssets();
      const location = currentLocation();
      const fromFolderId = location.type === "folder" ? location.id : null;
      const button = document.getElementById("move-submit");

      button.disabled = true;
      button.textContent = "Memindahkan...";

      const results = await Promise.allSettled(
        assets.map(asset => moveAssetToFolder(asset.id, destinationId, fromFolderId, user.user_id))
      );

      const success = results.filter(result => result.status === "fulfilled").length;
      const failed = results.length - success;

      button.disabled = false;
      button.textContent = "Pindahkan";
      closeModal("move-modal");

      if (success) showToast(`${success} aset berhasil dipindahkan`, "success");
      if (failed) showToast(`${failed} aset gagal dipindahkan`, "error");

      clearSelection(false);
      await loadLocationData();
    }

    async function downloadOneAsset(asset) {
      logDownload(asset.id, user.user_id);

      try {
        const response = await fetch(asset.url);
        if (!response.ok) throw new Error("Gagal mengambil file");
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = objectUrl;
        anchor.download = asset.nama_file || "download";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);
      } catch (error) {
        const anchor = document.createElement("a");
        anchor.href = asset.url;
        anchor.target = "_blank";
        anchor.rel = "noopener";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
    }

    async function bulkDownload() {
      const assets = selectedAssets();
      if (!assets.length || selectedFolders().length) return;

      showToast(`Menyiapkan ${assets.length} download...`, "success");

      for (const asset of assets) {
        await downloadOneAsset(asset);
        await new Promise(resolve => setTimeout(resolve, 250));
      }
    }

    async function bulkDelete() {
      const assets = selectedAssets();
      if (!assets.length || selectedFolders().length) return;

      if (!isManager() && assets.some(asset => asset.user_id !== user.user_id)) {
        showToast("Kamu hanya bisa menghapus aset milikmu sendiri", "error");
        return;
      }

      const ok = confirm(`Hapus ${assets.length} aset terpilih? Aksi ini tidak bisa dibatalkan.`);
      if (!ok) return;

      const results = await Promise.allSettled(
        assets.map(asset => deleteAsset(asset.id, user.user_id))
      );

      const successIds = assets
        .filter((asset, index) => results[index].status === "fulfilled")
        .map(asset => asset.id);

      allAssets = allAssets.filter(asset => !successIds.includes(asset.id));
      sharedAssetShares = sharedAssetShares.filter(share => !successIds.includes(share.assets?.id));

      const success = successIds.length;
      const failed = assets.length - success;

      if (success) showToast(`${success} aset berhasil dihapus`, "success");
      if (failed) showToast(`${failed} aset gagal dihapus`, "error");

      clearSelection(false);
      await loadLocationData();
    }

    function onAssetDeletedGallery(assetId) {
      allAssets = allAssets.filter(asset => asset.id !== assetId);
      sharedAssetShares = sharedAssetShares.filter(share => share.assets?.id !== assetId);
      selectedItems.delete(itemKey("asset", assetId));
      loadLocationData();
    }

    async function loadAll(resetLocation = false) {
      try {
        const [assetData, folderData, divisionData, sharedData] = await Promise.all([
          getAssets(user.user_id),
          getFolders(user.user_id),
          getDivisions(),
          getSharedAssets(user.user_id),
        ]);

        allAssets = assetData.assets || [];
        allFolders = folderData.folders || [];
        allDivisions = divisionData.divisions || [];
        sharedAssetShares = sharedData.shares || [];

        if (resetLocation) navStack = [];

        renderDivisionStrip();
        renderBreadcrumb();
        await loadLocationData();
        initDetailPanelFromURL();
      } catch (error) {
        document.getElementById("content-area").innerHTML = `
          <div class="empty-state">
            <i data-lucide="wifi-off" style="width:42px;height:42px;opacity:0.3;margin:0 auto 12px;display:block;"></i>
            <p style="color:var(--danger);">Gagal memuat data: ${escapeHtml(error.message)}</p>
            <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="loadAll()">Coba Lagi</button>
          </div>`;
        lucide.createIcons();
      }
    }

    async function updateGallerySearch() {
      const input = document.getElementById("search-input");
      const q = input.value.trim().toLowerCase();
      const requestSeq = ++searchRequestSeq;

      if (!q) {
        searchTagAssetIds = null;
        applyFiltersAndRender();
        return;
      }

      // Nama file/folder langsung difilter tanpa menunggu backend.
      searchTagAssetIds = [];
      applyFiltersAndRender();

      try {
        const data = await apiCall(
          `/search/gallery?user_id=${encodeURIComponent(user.user_id)}&q=${encodeURIComponent(q)}`
        );

        // Abaikan response lama kalau user sudah mengetik query baru.
        if (requestSeq !== searchRequestSeq) return;

        searchTagAssetIds = data.asset_ids || [];
        applyFiltersAndRender();
      } catch (error) {
        if (requestSeq !== searchRequestSeq) return;

        searchTagAssetIds = [];
        console.error("Gallery tag search gagal:", error);
        applyFiltersAndRender();
      }
    }

    document.getElementById("search-input").addEventListener(
      "input",
      debounce(updateGallerySearch, 250)
    );

    document.getElementById("sort-by").addEventListener("change", () => {
      applyFiltersAndRender();
    });

    document.addEventListener("click", event => {
      const menu = document.getElementById("folder-context-menu");
      if (menu.classList.contains("open") &&
          !menu.contains(event.target) &&
          !event.target.closest(".folder-more-btn") &&
          !event.target.closest(".list-more-btn")) {
        closeFolderMenu();
      }
    });

    window.addEventListener("resize", closeFolderMenu);
    window.addEventListener("scroll", closeFolderMenu, true);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeModal("share-modal");
        closeModal("move-modal");
        closeFolderMenu();
        closeFolderDetail();
      }

      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "a") {
        const tag = document.activeElement?.tagName;
        if (!["INPUT", "TEXTAREA", "SELECT"].includes(tag)) {
          event.preventDefault();
          toggleSelectAll(true);
        }
      }
    });

    setView(viewMode);
    renderBreadcrumb();
    loadTags();
    loadAll();
    lucide.createIcons();
  </script>
</body>
</html>
