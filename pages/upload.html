<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload — DAM</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .upload-wrap { max-width: 640px; }

    .dropzone {
      border: 2px dashed var(--border-dark);
      border-radius: var(--radius-lg);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: var(--surface);
      margin-bottom: 20px;
    }

    .dropzone.dragging {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .dropzone.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .dropzone-icon { font-size: 40px; margin-bottom: 10px; }

    .dropzone p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .file-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
    }

    .file-item-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .file-item-name {
      font-size: 13px;
      font-weight: 500;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-item-size {
      font-size: 12px;
      color: var(--text-muted);
    }

    .progress-bar-wrap {
      height: 6px;
      background: var(--border);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: var(--radius-full);
      width: 0%;
      transition: width 0.2s;
    }

    .file-status {
      font-size: 11px;
      margin-top: 6px;
      color: var(--text-muted);
    }

    .file-status.done  { color: var(--primary); }
    .file-status.error { color: var(--danger);  }

    .file-retry-btn {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .file-retry-btn:hover { text-decoration: underline; }

    .tags-result {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <button class="sidebar-toggle-btn" id="sidebar-toggle" title="Tampilkan/sembunyikan sidebar">
      <i data-lucide="panel-left"></i>
    </button>
    <div class="navbar-brand">DAM System</div>
    <div class="navbar-right">
      <span id="user-name" style="font-size:14px;color:var(--text-muted);"></span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Keluar</button>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label">Menu</div>
    <a href="gallery.html" class="sidebar-item">
      <i data-lucide="image"></i> Gallery
    </a>
    <a href="upload.html" class="sidebar-item active">
      <i data-lucide="upload-cloud"></i> Upload
    </a>
    <a href="folders.html" class="sidebar-item">
      <i data-lucide="folder"></i> Folder
    </a>
    <a href="profile.html" class="sidebar-item">
      <i data-lucide="user"></i> Profile
    </a>

    <div class="sidebar-label" id="sidebar-admin-label" style="display:none;">Admin</div>
    <a href="dashboard.html" class="sidebar-item" id="sidebar-dashboard" style="display:none;">
      <i data-lucide="layout-dashboard"></i> Dashboard
    </a>
    <a href="admin.html" class="sidebar-item" id="sidebar-users" style="display:none;">
      <i data-lucide="users"></i> Users
    </a>
  </aside>

  <main class="main-content">
    <div class="page-title">Upload Aset</div>

    <div class="upload-wrap">
      <div class="section-box" id="upload-division-box" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px;">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Upload ke folder divisi (khusus Manager):</div>
        <select class="input" id="upload-target-division" style="width:100%;">
          <option value="">Divisi saya sendiri</option>
        </select>
      </div>

      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">☁️</div>
        <p>Seret file ke sini atau klik untuk memilih</p>
        <p style="font-size:12px;">Mendukung: JPG, PNG, PDF, MP4, DOCX, XLSX (maks 50MB)</p>
        <button class="btn btn-outline btn-sm" type="button">Pilih File</button>
        <input type="file" id="file-input" multiple accept="image/*,video/*,.pdf,.docx,.xlsx" style="display:none;">
      </div>

      <div class="file-list" id="file-list"></div>

      <button class="btn btn-primary" id="btn-upload" style="display:none;width:100%;justify-content:center;">
        Upload Semua File
      </button>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    requireAuth();
    initSidebarToggle();
    if (isManager()) {
      document.getElementById("sidebar-admin-label").style.display = "block";
      document.getElementById("sidebar-users").style.display     = "flex";
      document.getElementById("sidebar-dashboard").style.display = "flex";
    }
    
    const user = getUser();
    document.getElementById("user-name").textContent = user.nama;

    if (isManager()) {
      document.getElementById("upload-division-box").style.display = "block";
      loadDivisionsForUpload();
    }

    async function loadDivisionsForUpload() {
      try {
        const res  = await fetch(`${API_BASE_URL}/divisions`);
        const data = await res.json();
        const sel  = document.getElementById("upload-target-division");
        sel.innerHTML = `<option value="">Divisi saya sendiri</option>` +
          data.divisions.map(d => `<option value="${d.id}">${d.nama}</option>`).join("");
      } catch (e) { console.error(e); }
    }

    let selectedFiles = [];
    let fileStatuses  = [];   // 'pending' | 'uploading' | 'done' | 'error'
    let fileTags      = [];   // hasil tag per file (untuk restore saat render ulang)
    let isUploading   = false;

    const dropzone  = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    const fileList  = document.getElementById("file-list");
    const btnUpload = document.getElementById("btn-upload");

    dropzone.addEventListener("click", () => fileInput.click());

    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragging");
    });

    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragging"));

    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragging");
      addFiles(Array.from(e.dataTransfer.files));
    });

    fileInput.addEventListener("change", () => {
      addFiles(Array.from(fileInput.files));
      fileInput.value = "";
    });

    function addFiles(files) {
      files.forEach(f => {
        if (f.size > 50 * 1024 * 1024) {
          showToast(`${f.name} melebihi 50MB`, "error");
          return;
        }
        selectedFiles.push(f);
        fileStatuses.push("pending");
        fileTags.push(null);
      });
      renderFileList();
    }

    function statusLabel(status) {
      switch (status) {
        case "done":      return { text: "Upload berhasil — tag otomatis:", cls: "file-status done" };
        case "error":     return { text: "Gagal upload",                   cls: "file-status error" };
        case "uploading": return { text: "Mengupload...",                  cls: "file-status" };
        default:          return { text: "Menunggu upload...",             cls: "file-status" };
      }
    }

    function renderFileList() {
      if (selectedFiles.length === 0) {
        fileList.innerHTML = "";
        btnUpload.style.display = "none";
        return;
      }

      btnUpload.style.display = "flex";
      fileList.innerHTML = selectedFiles.map((f, i) => {
        const status   = fileStatuses[i] || "pending";
        const label    = statusLabel(status);
        const pct      = status === "done" ? 100 : 0;
        const tagsHtml = (fileTags[i] || []).map(t => `<span class="tag-pill">${t}</span>`).join("");
        return `
        <div class="file-item" id="file-item-${i}">
          <div class="file-item-header">
            <span class="file-item-name">${f.name}</span>
            <span class="file-item-size">${formatFileSize(f.size)}</span>
          </div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="prog-${i}" style="width:${pct}%;"></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <div class="${label.cls}" id="status-${i}">${label.text}</div>
            <span class="file-retry-btn" id="retry-${i}" style="display:${status === 'error' ? 'inline' : 'none'};" onclick="retrySingle(${i})">Coba Lagi</span>
          </div>
          <div class="tags-result" id="tags-${i}">${tagsHtml}</div>
        </div>`;
      }).join("");

      updateUploadButton();
    }

    function updateUploadButton() {
      const errorCount = fileStatuses.filter(s => s === "error").length;
      const anyPending = fileStatuses.some(s => s === "pending");
      const allDone    = selectedFiles.length > 0 && fileStatuses.every(s => s === "done");

      if (allDone) {
        btnUpload.textContent = "Upload File Baru";
        btnUpload.onclick     = resetUpload;
      } else if (errorCount > 0 && !anyPending) {
        btnUpload.textContent = `Coba Lagi File Gagal (${errorCount})`;
        btnUpload.onclick     = () => uploadBatch(fileStatuses.map((s, i) => s === "error" ? i : null).filter(i => i !== null));
      } else {
        btnUpload.textContent = "Upload Semua File";
        btnUpload.onclick     = () => uploadBatch(selectedFiles.map((_, i) => i));
      }
      btnUpload.disabled = isUploading;
    }

    function resetUpload() {
      selectedFiles = [];
      fileStatuses  = [];
      fileTags      = [];
      renderFileList();
    }

    function retrySingle(i) {
      if (isUploading) return;
      uploadBatch([i]);
    }

    async function uploadBatch(indices) {
      if (isUploading || indices.length === 0) return;
      isUploading = true;
      dropzone.classList.add("disabled");
      btnUpload.disabled    = true;
      btnUpload.textContent = "Mengupload...";

      for (const i of indices) {
        const file     = selectedFiles[i];
        const statusEl = document.getElementById(`status-${i}`);
        const progEl   = document.getElementById(`prog-${i}`);
        const tagsEl   = document.getElementById(`tags-${i}`);
        const retryEl  = document.getElementById(`retry-${i}`);

        fileStatuses[i] = "uploading";
        statusEl.textContent = "Mengupload...";
        statusEl.className   = "file-status";
        retryEl.style.display = "none";
        tagsEl.innerHTML = "";

        try {
          const targetDiv = document.getElementById("upload-target-division")
            ? document.getElementById("upload-target-division").value
            : "";
          const result = await uploadAsset(user.user_id, file, (pct) => {
            progEl.style.width = pct + "%";
          }, 3, 4000, targetDiv || null);

          progEl.style.width  = "100%";
          fileStatuses[i]     = "done";
          fileTags[i]         = result.tags;
          statusEl.textContent = "Upload berhasil — tag otomatis:";
          statusEl.className   = "file-status done";
          tagsEl.innerHTML = result.tags.map(t => `<span class="tag-pill">${t}</span>`).join("");

        } catch (err) {
          fileStatuses[i] = "error";
          progEl.style.width = "0%";
          statusEl.textContent = "Gagal: " + err.message;
          statusEl.className   = "file-status error";
          retryEl.style.display = "inline";
        }
      }

      dropzone.classList.remove("disabled");
      isUploading = false;

      const doneCount  = fileStatuses.filter(s => s === "done").length;
      const errorCount = fileStatuses.filter(s => s === "error").length;

      if (errorCount === 0) {
        showToast(`${doneCount} file berhasil diupload`);
      } else if (doneCount === 0) {
        showToast(`${errorCount} file gagal diupload`, "error");
      } else {
        showToast(`${doneCount} berhasil, ${errorCount} gagal diupload`, "warning");
      }

      updateUploadButton();
    }

    lucide.createIcons();
  </script>
</body>
</html>
