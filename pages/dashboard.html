<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — DAM</title>

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    .dashboard-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .dashboard-subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 5px;
      line-height: 1.55;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 86px;
    }

    .stat-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .stat-icon svg {
      width: 18px;
      height: 18px;
    }

    .stat-icon.upload {
      background: #eaf3ff;
      color: #1976d2;
    }

    .stat-icon.download {
      background: #eef8ef;
      color: #2e7d32;
    }

    .stat-icon.share {
      background: #f4efff;
      color: #7e57c2;
    }

    .stat-icon.delete {
      background: #fff0f0;
      color: var(--primary);
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .activity-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .activity-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .activity-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .activity-title svg {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }

    .filter-bar {
      display: grid;
      grid-template-columns:
        minmax(130px, 1fr)
        minmax(130px, 1fr)
        minmax(130px, 1fr)
        minmax(125px, .9fr)
        minmax(125px, .9fr)
        minmax(120px, .9fr)
        auto
        auto;
      gap: 8px;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: var(--navbar-h);
      z-index: 7;
    }

    .filter-bar .input,
    .filter-bar select {
      min-width: 0;
      font-size: 12px;
      padding: 8px 9px;
    }

    .activity-meta-row {
      padding: 9px 18px;
      font-size: 11px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .activity-list {
      min-height: 220px;
    }

    .activity-group {
      border-bottom: 1px solid var(--border);
    }

    .activity-group:last-child {
      border-bottom: 0;
    }

    .activity-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto 24px;
      gap: 11px;
      align-items: center;
      padding: 11px 18px;
      cursor: pointer;
      transition: background 0.12s;
    }

    .activity-row:hover {
      background: var(--surface-2);
    }

    .activity-event-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .activity-event-icon svg {
      width: 14px;
      height: 14px;
    }

    .activity-event-icon.upload {
      background: #eaf3ff;
      color: #1976d2;
    }

    .activity-event-icon.download {
      background: #eef8ef;
      color: #2e7d32;
    }

    .activity-event-icon.share {
      background: #f4efff;
      color: #7e57c2;
    }

    .activity-event-icon.delete {
      background: #fff0f0;
      color: var(--primary);
    }

    .activity-event-icon.tag_added,
    .activity-event-icon.tag_removed {
      background: #fff8df;
      color: #9b7200;
    }

    .activity-event-icon.move,
    .activity-event-icon.remove_from_folder {
      background: #eef7fb;
      color: #19758c;
    }

    .activity-main {
      min-width: 0;
    }

    .activity-line {
      font-size: 12px;
      line-height: 1.4;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .activity-line strong {
      font-weight: 650;
    }

    .activity-sub {
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 10px;
      min-width: 0;
    }

    .activity-sub span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-count {
      min-width: 34px;
      height: 24px;
      padding: 0 8px;
      border-radius: var(--radius-full);
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .activity-chevron {
      color: var(--text-muted);
      transition: transform .15s;
    }

    .activity-chevron svg {
      width: 15px;
      height: 15px;
    }

    .activity-group.open .activity-chevron {
      transform: rotate(180deg);
    }

    .activity-detail {
      display: none;
      padding: 0 18px 12px 63px;
      background: var(--surface);
    }

    .activity-group.open .activity-detail {
      display: block;
    }

    .detail-box {
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .detail-item {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 10px;
      padding: 8px 11px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    .detail-item:last-child {
      border-bottom: 0;
    }

    .detail-label {
      color: var(--text-muted);
    }

    .detail-value {
      min-width: 0;
      word-break: break-word;
    }

    .detail-history-title {
      padding: 9px 11px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    .detail-history-row {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 10px;
      padding: 7px 11px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
    }

    .detail-history-row:last-child {
      border-bottom: 0;
    }

    .empty-log {
      padding: 55px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    .empty-log svg {
      width: 38px;
      height: 38px;
      opacity: .28;
      margin-bottom: 10px;
    }

    .pagination {
      border-top: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pagination-info {
      font-size: 11px;
      color: var(--text-muted);
    }

    .pagination-buttons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .page-btn {
      min-width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 7px;
      font-size: 11px;
      cursor: pointer;
      padding: 0 8px;
      color: var(--text-muted);
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .page-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .page-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .loading-wrap {
      display: flex;
      justify-content: center;
      padding: 55px;
    }

    @media (max-width: 1100px) {
      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filter-bar {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .filter-bar {
        grid-template-columns: 1fr 1fr;
      }

      .activity-row {
        grid-template-columns: 32px minmax(0,1fr) auto;
      }

      .activity-chevron {
        display: none;
      }

      .activity-detail {
        padding-left: 18px;
      }

      .detail-item {
        grid-template-columns: 1fr;
        gap: 3px;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <button class="sidebar-toggle-btn" id="sidebar-toggle" title="Tampilkan/sembunyikan sidebar">
      <i data-lucide="panel-left"></i>
    </button>

    <div class="navbar-brand">DAM System</div>

    <div class="navbar-right">
      <span class="badge badge-red" style="font-size:9px;padding:3px 7px;">ADMIN</span>
      <span id="user-name" style="font-size:14px;color:var(--text-muted);"></span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Keluar</button>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label">Menu</div>

    <a href="gallery.html" class="sidebar-item">
      <i data-lucide="image"></i> Gallery
    </a>

    <a href="upload.html" class="sidebar-item">
      <i data-lucide="upload-cloud"></i> Upload
    </a>

    <a href="folders.html" class="sidebar-item">
      <i data-lucide="folder"></i> Folder
    </a>

    <a href="profile.html" class="sidebar-item">
      <i data-lucide="user"></i> Profile
    </a>

    <div class="sidebar-label">Admin</div>

    <a href="dashboard.html" class="sidebar-item active">
      <i data-lucide="layout-dashboard"></i> Dashboard
    </a>

    <a href="admin.html" class="sidebar-item">

    </a>

  <main class="main-content">
    <div class="dashboard-head">

        <div class="dashboard-subtitle">
          Ringkasan aktivitas DAM dan audit trail staff.
        </div>
      </div>
    </div>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon upload"><i data-lucide="upload-cloud"></i></div>
        <div>
          <div class="stat-value" id="stat-upload">0</div>
          <div class="stat-label">Upload</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon download"><i data-lucide="download"></i></div>
        <div>
          <div class="stat-value" id="stat-download">0</div>
          <div class="stat-label">Download</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon share"><i data-lucide="share-2"></i></div>
        <div>
          <div class="stat-value" id="stat-share">0</div>
          <div class="stat-label">Share</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon delete"><i data-lucide="trash-2"></i></div>
        <div>
          <div class="stat-value" id="stat-delete">0</div>
          <div class="stat-label">Delete</div>
        </div>
      </div>
    </section>

    <section class="activity-card">
      <div class="activity-card-head">
        <div class="activity-title">
          <i data-lucide="activity"></i>
          Aktivitas Staff
        </div>
      </div>

      <div class="filter-bar">
        <select class="input" id="filter-type">
          <option value="">Semua aktivitas</option>
          <option value="upload">Upload</option>
          <option value="download">Download</option>
          <option value="share">Share</option>
          <option value="delete">Delete</option>
          <option value="tag_added">Tambah Tag</option>
          <option value="tag_removed">Hapus Tag</option>
          <option value="move">Move</option>

        <select class="input" id="filter-user">

      <div class="activity-list" id="activity-list">

      <div class="pagination" id="pagination" style="display:none;">

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>

  <script src="../js/utils.js"></script>

  <script>
    requireAuth();
    initSidebarToggle();

    const user = getUser();

    if (!isManager()) {
      window.location.href = "gallery.html";
    }

    document.getElementById("user-name").textContent = user?.nama || "Admin";

    const PAGE_SIZE = 20;
    const GROUP_WINDOW_MS = 15 * 60 * 1000;

    let rawActivities = [];
    let groupedActivities = [];
    let currentPage = 1;

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDateTime(value) {
      if (!value) return "—";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return new Intl.DateTimeFormat("id-ID", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      }).format(date);
    }

    function formatTimeOnly(value) {
      if (!value) return "—";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return new Intl.DateTimeFormat("id-ID", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      }).format(date);
    }

    function eventIcon(type) {
      const map = {
        upload: "upload-cloud",
        download: "download",
        share: "share-2",
        delete: "trash-2",
        tag_added: "tag",
        tag_removed: "tag",
        move: "folder-input",
        remove_from_folder: "folder-minus",
      };

      return map[type] || "activity";
    }

    function eventVerb(item) {
      switch (item.type) {
        case "upload":
          return "mengupload";
        case "download":
          return "mendownload";
        case "share":
          return "membagikan";
        case "delete":
          return "menghapus";
        case "tag_added":
          return `menambahkan ${item.count || 0} tag pada`;
        case "tag_removed":
          return `menghapus tag "${item.tag || "—"}" dari`;
        case "move":
          return "memindahkan";
        case "remove_from_folder":
          return "mengeluarkan";
        default:
          return "melakukan aktivitas pada";
      }
    }

    function groupKey(item) {
      return [
        item.type || "",
        item.user_id || item.user || "",
        item.file || "",
        item.division_id || item.division || "",
        item.to_folder || "",
        item.from_folder || "",
        item.folder || "",
        item.tag || "",
      ].join("::");
    }

    function groupActivities(items) {
      const grouped = [];

      for (const item of items) {
        const key = groupKey(item);
        const timestamp = new Date(item.created_at).getTime();
        const previous = grouped[grouped.length - 1];

        if (
          previous &&
          previous.key === key &&
          Math.abs(previous.lastTimestamp - timestamp) <= GROUP_WINDOW_MS
        ) {
          previous.items.push(item);
          previous.count += 1;
          previous.lastTimestamp = timestamp;

          const currentDate = new Date(previous.latest.created_at).getTime();
          if (timestamp > currentDate) {
            previous.latest = item;
          }

          continue;
        }

        grouped.push({
          key,
          latest: item,
          items: [item],
          count: 1,
          lastTimestamp: timestamp,
        });
      }

      return grouped;
    }

    function buildApiParams() {
      const params = {
        limit: 500,
        sort: document.getElementById("filter-sort").value || "desc",
      };

      const type = document.getElementById("filter-type").value;
      const userId = document.getElementById("filter-user").value;
      const divisionId = document.getElementById("filter-division").value;
      const dateFrom = document.getElementById("filter-from").value;
      const dateTo = document.getElementById("filter-to").value;

      if (type) params.type = type;
      if (userId) params.user_id = userId;
      if (divisionId) params.division_id = divisionId;
      if (dateFrom) params.date_from = dateFrom;
      if (dateTo) params.date_to = dateTo;

      return params;
    }

    async function loadFilterOptions() {
      try {
        const [usersResult, divisionsResult] = await Promise.all([
          getAllUsersWithDivision(),
          getDivisions(),
        ]);

        const userSelect = document.getElementById("filter-user");
        const divisionSelect = document.getElementById("filter-division");

        (usersResult.users || [])
          .slice()
          .sort((a, b) => String(a.nama || "").localeCompare(String(b.nama || "")))
          .forEach(item => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item.nama || item.email || "User";
            userSelect.appendChild(option);
          });

        (divisionsResult.divisions || [])
          .filter(item => String(item.nama || "").trim().toLowerCase() !== "custom")
          .slice()
          .sort((a, b) => String(a.nama || "").localeCompare(String(b.nama || "")))
          .forEach(item => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item.nama || "Divisi";
            divisionSelect.appendChild(option);
          });

      } catch (error) {
        console.error("Gagal memuat opsi filter:", error);
      }
    }

    async function loadActivities(resetPage = true) {
      if (resetPage) currentPage = 1;

      const list = document.getElementById("activity-list");
      list.innerHTML = `<div class="loading-wrap"><div class="spinner"></div></div>`;

      try {
        const result = await getAdminActivity(buildApiParams());

        rawActivities = result.activities || [];
        groupedActivities = groupActivities(rawActivities);

        updateStats();
        renderActivityPage();

      } catch (error) {
        console.error(error);

        list.innerHTML = `
          <div class="empty-log">
            <i data-lucide="wifi-off"></i>
            <div>Gagal memuat aktivitas.</div>
            <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="loadActivities()">Coba Lagi</button>
          </div>
        `;

        document.getElementById("activity-result-info").textContent =
          error?.message || "Gagal memuat aktivitas";

        document.getElementById("pagination").style.display = "none";

        lucide.createIcons();
      }
    }

    function updateStats() {
      const counts = {
        upload: 0,
        download: 0,
        share: 0,
        delete: 0,
      };

      rawActivities.forEach(item => {
        if (Object.prototype.hasOwnProperty.call(counts, item.type)) {
          counts[item.type] += 1;
        }
      });

      document.getElementById("stat-upload").textContent = counts.upload;
      document.getElementById("stat-download").textContent = counts.download;
      document.getElementById("stat-share").textContent = counts.share;
      document.getElementById("stat-delete").textContent = counts.delete;
    }

    function activitySentence(item) {
      const file = item.file || "—";
      const userName = item.user || "—";

      let sentence = `
        <strong>${esc(userName)}</strong>
        ${esc(eventVerb(item))}
        <strong>${esc(file)}</strong>
      `;

      if (item.type === "move" && item.to_folder) {
        sentence += ` ke <strong>${esc(item.to_folder)}</strong>`;
      }

      if (item.type === "remove_from_folder" && item.folder) {
        sentence += ` dari <strong>${esc(item.folder)}</strong>`;
      }

      if (item.type === "share" && item.division && item.division !== "—") {
        sentence += ` ke <strong>${esc(item.division)}</strong>`;
      }

      return sentence;
    }

    function renderDetailBox(group) {
      const item = group.latest;

      const detailRows = [
        ["Aktivitas", eventVerb(item)],
        ["User", item.user || "—"],
        ["File", item.file || "—"],
        ["Divisi", item.division || "—"],
        ["Waktu terbaru", formatDateTime(item.created_at)],
      ];

      if (item.ukuran !== undefined && item.ukuran !== null) {
        detailRows.push([
          "Ukuran",
          typeof formatFileSize === "function"
            ? formatFileSize(item.ukuran)
            : `${item.ukuran} B`
        ]);
      }

      if (item.tipe) {
        detailRows.push(["Tipe file", item.tipe]);
      }

      if (item.to_folder) {
        detailRows.push(["Folder tujuan", item.to_folder]);
      }

      if (item.from_folder) {
        detailRows.push(["Folder asal", item.from_folder]);
      }

      if (item.folder) {
        detailRows.push(["Folder", item.folder]);
      }

      if (Array.isArray(item.tags) && item.tags.length) {
        detailRows.push(["Tag", item.tags.join(", ")]);
      }

      if (item.catatan) {
        detailRows.push(["Catatan", item.catatan]);
      }

      let html = `<div class="detail-box">`;

      html += detailRows.map(([label, value]) => `
        <div class="detail-item">
          <div class="detail-label">${esc(label)}</div>
          <div class="detail-value">${esc(value)}</div>
        </div>
      `).join("");

      if (group.count > 1) {
        html += `<div class="detail-history-title">${group.count} aktivitas yang diringkas</div>`;

        html += group.items.map(event => `
          <div class="detail-history-row">
            <div>${esc(formatTimeOnly(event.created_at))}</div>
            <div>${esc(event.user || "—")} · ${esc(event.file || "—")}</div>
          </div>
        `).join("");
      }

      html += `</div>`;

      return html;
    }

    function renderGroup(group, absoluteIndex) {
      const item = group.latest;

      return `
        <div class="activity-group" id="activity-group-${absoluteIndex}">
          <div class="activity-row" onclick="toggleActivityDetail(${absoluteIndex})">
            <div class="activity-event-icon ${esc(item.type || "")}">
              <i data-lucide="${eventIcon(item.type)}"></i>
            </div>

            <div class="activity-main">
              <div class="activity-line">${activitySentence(item)}</div>
              <div class="activity-sub">
                <span>${esc(item.division || "—")}</span>
                <span>•</span>
                <span>${esc(formatDateTime(item.created_at))}</span>
              </div>
            </div>

            ${group.count > 1
              ? `<div class="group-count">×${group.count}</div>`
              : `<div></div>`}

            <div class="activity-chevron">
              <i data-lucide="chevron-down"></i>
            </div>
          </div>

          <div class="activity-detail">
            ${renderDetailBox(group)}
          </div>
        </div>
      `;
    }

    function renderActivityPage() {
      const totalGroups = groupedActivities.length;
      const totalPages = Math.max(1, Math.ceil(totalGroups / PAGE_SIZE));

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      const start = (currentPage - 1) * PAGE_SIZE;
      const end = Math.min(start + PAGE_SIZE, totalGroups);
      const pageGroups = groupedActivities.slice(start, end);

      const list = document.getElementById("activity-list");

      if (!pageGroups.length) {
        list.innerHTML = `
          <div class="empty-log">
            <i data-lucide="inbox"></i>
            <div>Tidak ada aktivitas untuk filter ini.</div>
          </div>
        `;

        document.getElementById("activity-result-info").textContent =
          "0 aktivitas";

        document.getElementById("pagination").style.display = "none";
        lucide.createIcons();
        return;
      }

      list.innerHTML = pageGroups
        .map((group, index) => renderGroup(group, start + index))
        .join("");

      const duplicateReduction = rawActivities.length - totalGroups;

      document.getElementById("activity-result-info").textContent =
        `${rawActivities.length} aktivitas · ${totalGroups} baris setelah grouping` +
        (duplicateReduction > 0 ? ` · ${duplicateReduction} baris diringkas` : "");

      renderPagination(totalPages, start, end, totalGroups);
      lucide.createIcons();
    }

    function toggleActivityDetail(index) {
      const el = document.getElementById(`activity-group-${index}`);

      if (!el) return;

      el.classList.toggle("open");
    }

    function renderPagination(totalPages, start, end, totalGroups) {
      const wrap = document.getElementById("pagination");
      const info = document.getElementById("pagination-info");
      const buttons = document.getElementById("pagination-buttons");

      wrap.style.display = "flex";

      info.textContent =
        `Menampilkan ${start + 1}–${end} dari ${totalGroups} baris aktivitas`;

      const pageSet = new Set([
        1,
        totalPages,
        currentPage - 1,
        currentPage,
        currentPage + 1,
      ]);

      const pages = Array.from(pageSet)
        .filter(page => page >= 1 && page <= totalPages)
        .sort((a, b) => a - b);

      let html = `
        <button class="page-btn" ${currentPage === 1 ? "disabled" : ""}
          onclick="goToPage(${currentPage - 1})">
          Sebelumnya
        </button>
      `;

      let previous = null;

      for (const page of pages) {
        if (previous !== null && page - previous > 1) {
          html += `<span style="font-size:11px;color:var(--text-muted);padding:0 2px;">…</span>`;
        }

        html += `
          <button class="page-btn ${page === currentPage ? "active" : ""}"
            onclick="goToPage(${page})">
            ${page}
          </button>
        `;

        previous = page;
      }

      html += `
        <button class="page-btn" ${currentPage === totalPages ? "disabled" : ""}
          onclick="goToPage(${currentPage + 1})">
          Berikutnya
        </button>
      `;

      buttons.innerHTML = html;
    }

    function goToPage(page) {
      const totalPages = Math.max(
        1,
        Math.ceil(groupedActivities.length / PAGE_SIZE)
      );

      if (page < 1 || page > totalPages) return;

      currentPage = page;
      renderActivityPage();

      document.querySelector(".activity-card")
        ?.scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
    }

    function resetFilters() {
      document.getElementById("filter-type").value = "";
      document.getElementById("filter-user").value = "";
      document.getElementById("filter-division").value = "";
      document.getElementById("filter-from").value = "";
      document.getElementById("filter-to").value = "";
      document.getElementById("filter-sort").value = "desc";

      loadActivities();
    }

    function exportCsv() {
      if (!rawActivities.length) {
        if (typeof showToast === "function") {
          showToast("Tidak ada aktivitas untuk diexport", "warning");
        }
        return;
      }

      const headers = [
        "Tipe",
        "User",
        "Divisi",
        "File",
        "Tanggal",
        "Folder Asal",
        "Folder Tujuan",
        "Tag",
        "Catatan",
      ];

      const rows = rawActivities.map(item => [
        item.type || "",
        item.user || "",
        item.division || "",
        item.file || "",
        item.created_at || "",
        item.from_folder || item.folder || "",
        item.to_folder || "",
        Array.isArray(item.tags)
          ? item.tags.join(" | ")
          : (item.tag || ""),
        item.catatan || "",
      ]);

      const escapeCsv = value => {
        const text = String(value ?? "");

        if (
          text.includes(",") ||
          text.includes('"') ||
          text.includes("\n")
        ) {
          return `"${text.replaceAll('"', '""')}"`;
        }

        return text;
      };

      const csv = [
        headers.map(escapeCsv).join(","),
        ...rows.map(row => row.map(escapeCsv).join(",")),
      ].join("\n");

      const blob = new Blob(
        ["\ufeff" + csv],
        { type: "text/csv;charset=utf-8;" }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download =
        `dam-activity-${new Date().toISOString().slice(0, 10)}.csv`;

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    [
      "filter-type",
      "filter-user",
      "filter-division",
      "filter-from",
      "filter-to",
      "filter-sort",
    ].forEach(id => {
      document.getElementById(id)
        .addEventListener("change", () => loadActivities());
    });

    async function init() {
      await loadFilterOptions();
      await loadActivities();
      lucide.createIcons();
    }

    init();
  </script>
</body>
</html>
